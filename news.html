<main>

  <section class="hero hero-sub hero-photo hero-city">
    <div class="wrap hero-inner">
      <p class="eyebrow">NEWS</p>
      <h1>お知らせ</h1>
      <p class="hero-lead">MINATOからの毎月の更新情報をお届けします。</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <ul class="news-list" id="news-list"></ul>
      <p class="news-empty" id="news-empty" hidden>現在、お知らせはありません。</p>
    </div>

  <div class="wrap footer-inner">

  </div>
</footer>

<script src="news.js" charset="utf-8"></script>
<script>
(function () {
  var list = document.getElementById("news-list");
  var items = (typeof NEWS !== "undefined" ? NEWS.slice() : [])
    .sort(function (a, b) { return a.date < b.date ? 1 : -1; });

  if (!items.length) { document.getElementById("news-empty").hidden = false; return; }

  items.forEach(function (n) {
    var li = document.createElement("li");
    li.className = "news-item";

    var meta = document.createElement("div");
    meta.className = "news-meta";
    var d = document.createElement("time");
    d.textContent = n.date.replace(/-/g, ".");
    var c = document.createElement("span");
    c.className = "news-cat";
    c.textContent = n.category || "お知らせ";
    meta.appendChild(d);
    meta.appendChild(c);

    var h = document.createElement("h2");
    h.className = "news-title";
    h.textContent = n.title;

    var p = document.createElement("p");
    p.className = "news-body";
    p.textContent = n.body;

    li.appendChild(meta);
    li.appendChild(h);
    li.appendChild(p);

    if (n.link) {
      var a = document.createElement("a");
      a.className = "news-link";
      a.href = n.link;
      a.textContent = "詳しく見る →";
      li.appendChild(a);
    }
    list.appendChild(li);
  });
})();
</script>

<script src="menu.js"></script>
</body>
</html>
